<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>365 Days · Akansha</title>

  <!-- Inter as a variable font (weights 100 to 800) so font-weight can animate smoothly -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..800&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       1. DESIGN TOKENS: tweak colours, sizes and timing here
       ========================================================= */
    :root {
      --bg:          #0a0a0b;               /* page background */
      --text:        #f3efe8;               /* main off-white text */
      --muted:       rgba(243, 239, 232, .42);
      --faint:       rgba(243, 239, 232, .08);
      --glow:        #ffcdb5;               /* warm glow colour for the line */
      --glow-soft:   rgba(255, 205, 181, .45);

      /* Position of the glowing line (overridden per breakpoint below) */
      --line-x:      20px;
      --rail-top:    150px;                 /* space reserved for "Ahmedabad" */
      --rail-bottom: 96px;                  /* space reserved for "Delhi" */

      /* Reveal animation (JS writes --reveal-duration from CONFIG) */
      --reveal-duration: 1400ms;
      --reveal-ease:     cubic-bezier(.16, 1, .3, 1);
      --reveal-shift:    28px;

      /* Updated live by JS: 0 at Ahmedabad, 1 at Delhi */
      --progress: 0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 300;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    ::selection { background: var(--glow); color: var(--bg); }

    /* =========================================================
       2. THE GLOWING LINE (fixed to the viewport)
       ========================================================= */
    .rail {
      position: fixed;
      top: 0;
      bottom: 0;
      left: var(--line-x);
      width: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* Vertical city labels, centred on the line */
    .rail__label {
      position: absolute;
      left: 0;
      transform: translateX(-50%) rotate(180deg);
      writing-mode: vertical-rl;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .38em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      transition: color 1.2s ease, text-shadow 1.2s ease;
    }
    .rail__label--top    { top: 28px; color: var(--text); }
    .rail__label--bottom { bottom: 22px; }

    /* Lights up once she "arrives" in Delhi */
    .rail.is-arrived .rail__label--bottom {
      color: var(--glow);
      text-shadow: 0 0 12px var(--glow-soft);
    }

    /* Dim, unlit track */
    .rail__track {
      position: absolute;
      top: var(--rail-top);
      bottom: var(--rail-bottom);
      left: -0.5px;
      width: 1px;
      background: var(--faint);
    }

    /* The glowing part that grows with scroll */
    .rail__fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: calc(var(--progress) * 100%);
      background: linear-gradient(to bottom, rgba(243, 239, 232, .25), var(--glow));
      box-shadow:
        0 0 6px  var(--glow-soft),
        0 0 18px var(--glow-soft);
    }

    /* The travelling point of light at the tip */
    .rail__dot {
      position: absolute;
      left: 0;
      top: calc(var(--progress) * 100%);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 6px 1px #fff,
        0 0 16px 4px var(--glow),
        0 0 36px 10px var(--glow-soft);
    }
    .rail.is-arrived .rail__dot { animation: heartbeat 2.4s ease-in-out infinite; }

    @keyframes heartbeat {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      14%      { transform: translate(-50%, -50%) scale(1.6); }
      28%      { transform: translate(-50%, -50%) scale(1); }
      42%      { transform: translate(-50%, -50%) scale(1.4); }
    }

    /* Small kilometre readout beside the dot (hidden on phones) */
    .rail__km {
      position: absolute;
      left: 16px;
      top: calc(var(--progress) * 100%);
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .2em;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Checkpoints for each chapter (created by JS) */
    .rail__tick {
      position: absolute;
      left: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid rgba(243, 239, 232, .22);
      transform: translate(-50%, -50%);
      transition: background .6s ease, border-color .6s ease, box-shadow .6s ease;
    }
    .rail__tick.is-passed {
      background: var(--glow);
      border-color: var(--glow);
      box-shadow: 0 0 10px var(--glow-soft);
    }

    /* =========================================================
       3. PAGE LAYOUT
       ========================================================= */
    main {
      /* Keep text clear of the line on small screens */
      padding-left: calc(var(--line-x) + 34px);
      padding-right: 22px;
    }

    .section {
      min-height: 100vh;
      min-height: 100svh;
      max-width: 620px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18vh 0;
    }

    /* ---------- Hero ---------- */
    .hero { padding-top: 12vh; }

    .eyebrow {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero__number {
      font-size: clamp(6.5rem, 30vw, 13rem);
      line-height: .9;
      letter-spacing: -.06em;
      margin: 1.6rem 0 .4rem -.06em;
      text-shadow: 0 0 40px rgba(255, 205, 181, .18);
    }

    .hero__unit {
      font-size: clamp(1rem, 4vw, 1.25rem);
      letter-spacing: .5em;
      text-transform: uppercase;
      color: var(--text);
    }

    .hero__date {
      margin-top: 2.6rem;
      font-size: clamp(1.4rem, 5.5vw, 2rem);
      line-height: 1.3;
      letter-spacing: -.02em;
    }

    .hero__sub {
      margin-top: .7rem;
      color: var(--muted);
      font-size: 1rem;
    }

    /* Scroll cue: a thin line that keeps "dripping" downward */
    .scroll-cue {
      margin-top: 4.5rem;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 10px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .scroll-cue__line {
      position: relative;
      width: 1px;
      height: 46px;
      background: var(--faint);
      overflow: hidden;
    }
    .scroll-cue__line::after {
      content: '';
      position: absolute;
      left: 0;
      top: -50%;
      width: 1px;
      height: 50%;
      background: var(--glow);
      box-shadow: 0 0 8px var(--glow);
      animation: drip 2.2s cubic-bezier(.6, 0, .4, 1) infinite;
    }
    @keyframes drip {
      to { top: 100%; }
    }

    /* ---------- Letter chapters ---------- */
    .chapter__num {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .2em;
      color: var(--glow);
      margin-bottom: 1.4rem;
    }

    .chapter__title {
      font-size: clamp(1.9rem, 7vw, 3rem);
      line-height: 1.12;
      letter-spacing: -.035em;
      margin-bottom: 2rem;
    }

    .chapter p {
      font-size: clamp(1.05rem, 3.9vw, 1.2rem);
      color: rgba(243, 239, 232, .78);
    }
    .chapter p + p { margin-top: 1.3rem; }

    /* A quiet emphasis style for lines you want to stand out */
    .chapter .whisper {
      color: var(--text);
      font-weight: 400;
    }

    /* ---------- Footer / Delhi ---------- */
    .finale {
      text-align: left;
      padding-bottom: calc(var(--rail-bottom) + 12vh);
    }

    .marker {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 3rem;
    }
    .marker__pin {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--glow);
      box-shadow: 0 0 10px var(--glow), 0 0 28px var(--glow-soft);
    }
    .marker__text {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--glow);
    }

    .finale__line {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 2.4rem;
    }

    .finale__title {
      font-size: clamp(2.2rem, 9vw, 3.8rem);
      line-height: 1.08;
      letter-spacing: -.04em;
    }
    .finale__title .name {
      color: var(--glow);
      text-shadow: 0 0 28px rgba(255, 205, 181, .35);
    }

    .finale__note {
      margin-top: 2.2rem;
      max-width: 34ch;
      font-size: clamp(1.05rem, 3.9vw, 1.2rem);
      color: rgba(243, 239, 232, .78);
    }

    .finale__sign {
      margin-top: 3rem;
      font-size: 1.15rem;
      color: var(--muted);
    }
    .finale__sign strong {
      display: block;
      margin-top: .2rem;
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -.02em;
    }

    /* =========================================================
       4. SCROLL-TRIGGERED REVEAL
       Elements with [data-reveal] start hidden + thin, then
       fade in, slide up and gain weight when .is-visible is added.
       Use data-weight="100" / "600" etc. to set the final weight.
       ========================================================= */
    [data-reveal] {
      opacity: 0;
      transform: translate3d(0, var(--reveal-shift), 0);
      filter: blur(6px);
      font-weight: 100;
      transition:
        opacity     var(--reveal-duration) var(--reveal-ease),
        transform   var(--reveal-duration) var(--reveal-ease),
        filter      var(--reveal-duration) var(--reveal-ease),
        font-weight calc(var(--reveal-duration) * 1.4) var(--reveal-ease);
      transition-delay: var(--delay, 0ms);
      will-change: opacity, transform;
    }

    [data-reveal].is-visible {
      opacity: 1;
      transform: none;
      filter: none;
      font-weight: var(--weight-to, 300);
    }

    /* =========================================================
       5. RESPONSIVE
       ========================================================= */
    @media (min-width: 640px) {
      :root { --line-x: 40px; }
      main  { padding-left: calc(var(--line-x) + 64px); padding-right: 48px; }
    }

    /* Wide screens: centre the text column and park the line
       a comfortable distance to its left */
    @media (min-width: 1000px) {
      :root { --line-x: calc(50vw - 410px); }
      main  { padding-left: 0; padding-right: 0; }
    }

    @media (max-width: 639px) {
      .rail__km    { display: none; }
      .rail__label { font-size: 9px; letter-spacing: .32em; }
      :root        { --rail-top: 128px; --rail-bottom: 82px; }
    }

    /* Respect people who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      [data-reveal] { transition: opacity .6s ease; transform: none; filter: none; }
      .scroll-cue__line::after,
      .rail.is-arrived .rail__dot { animation: none; }
    }
  </style>

  <style>
    /* ---------- Lock screen ---------- */
    .lock {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      background: var(--bg);
      transition: opacity .9s ease, visibility .9s ease;
    }
    .lock.is-open { opacity: 0; visibility: hidden; }

    .lock__inner { width: 100%; max-width: 360px; }

    .lock__pin {
      display: block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px 1px #fff, 0 0 16px 4px var(--glow), 0 0 36px 10px var(--glow-soft);
      margin-bottom: 2.4rem;
      animation: lockPulse 2.8s ease-in-out infinite;
    }
    @keyframes lockPulse { 50% { opacity: .45; } }

    .lock__eyebrow {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .lock__title {
      margin: .8rem 0 2.2rem;
      font-size: clamp(1.7rem, 7vw, 2.2rem);
      font-weight: 300;
      line-height: 1.2;
      letter-spacing: -.03em;
    }

    .lock__field {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      border-bottom: 1px solid rgba(243, 239, 232, .22);
      transition: border-color .3s ease;
    }
    .lock__field:focus-within { border-color: var(--glow); }

    .lock__input {
      flex: 1;
      min-width: 0;
      padding: 10px 0;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--text);
      font: 300 1.1rem/1.4 'Inter', system-ui, sans-serif;
      letter-spacing: .08em;
    }

    .lock__btn {
      padding: 10px 0;
      background: none;
      border: 0;
      color: var(--glow);
      font: 400 11px/1.4 'Inter', system-ui, sans-serif;
      letter-spacing: .34em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .lock__btn:focus-visible { outline: 1px solid var(--glow); outline-offset: 4px; }
    .lock__btn:disabled { opacity: .5; cursor: default; }

    .lock__msg {
      min-height: 1.6em;
      margin-top: 1rem;
      font-size: .9rem;
      color: var(--muted);
    }

    .lock.is-wrong .lock__field { animation: shake .4s ease; }
    @keyframes shake {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .lock__pin, .lock.is-wrong .lock__field { animation: none; }
    }
  </style>
</head>

<body>

  <div class="lock" id="lock">
    <form class="lock__inner" id="lockForm" autocomplete="off">
      <span class="lock__pin" aria-hidden="true"></span>
      <p class="lock__eyebrow">For Akansha</p>
      <h1 class="lock__title">Something I wrote for you.</h1>
      <label class="lock__field">
        <span class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Password</span>
        <input class="lock__input" id="lockInput" type="password" placeholder="Password" autocapitalize="off" autocorrect="off" spellcheck="false" required />
        <button class="lock__btn" id="lockBtn" type="submit">Open</button>
      </label>
      <p class="lock__msg" id="lockMsg" aria-live="polite"></p>
    </form>
  </div>

    // Everything below startLetter() is the page script from letter.html.
    function startLetter() {
    /* =========================================================
       CONFIG: the knobs you'll most likely want to adjust
       ========================================================= */
    const CONFIG = {
      // How much of an element must be visible before it animates in (0 → 1).
      // 0.15 = as soon as 15% of it is on screen.
      revealThreshold: 0.15,

      // Shrinks the "trigger zone" so text animates a bit after it enters.
      // '-10%' at the bottom = wait until it's 10% above the bottom edge.
      revealRootMargin: '0px 0px -10% 0px',

      // Length of each fade/slide/weight transition in milliseconds.
      revealDuration: 1400,

      // Delay between items in the same section (makes them cascade in).
      staggerDelay: 160,

      // Default final font-weight for revealed text (thin → this).
      // Individual elements can override with data-weight="500" etc.
      defaultWeight: 300,

      // true  = text fades out again when scrolled away and re-animates.
      // false = each line animates once and stays.
      repeatReveal: false,

      // Rough road distance Ahmedabad → Delhi, shown beside the glowing dot.
      distanceKm: 950,

      // Progress (0 → 1) at which the line counts as "arrived" in Delhi.
      arriveAt: 0.985
    };

    /* =========================================================
       1. SCROLL-TRIGGERED TEXT (IntersectionObserver)
       ========================================================= */
    const root = document.documentElement;
    root.style.setProperty('--reveal-duration', CONFIG.revealDuration + 'ms');

    const revealEls = document.querySelectorAll('[data-reveal]');

    // Give each element its stagger delay (based on its order within its section)
    // and its target font-weight.
    document.querySelectorAll('.section').forEach(section => {
      section.querySelectorAll('[data-reveal]').forEach((el, i) => {
        el.style.setProperty('--delay', (i * CONFIG.staggerDelay) + 'ms');
        el.style.setProperty('--weight-to', el.dataset.weight || CONFIG.defaultWeight);
      });
    });

    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            if (!CONFIG.repeatReveal) observer.unobserve(entry.target);
          } else if (CONFIG.repeatReveal) {
            entry.target.classList.remove('is-visible');
          }
        });
      }, {
        threshold: CONFIG.revealThreshold,
        rootMargin: CONFIG.revealRootMargin
      });

      revealEls.forEach(el => observer.observe(el));
    } else {
      // Very old browsers: just show everything.
      revealEls.forEach(el => el.classList.add('is-visible'));
    }

    /* =========================================================
       2. THE GLOWING LINE: fills as you scroll
       ========================================================= */
    const rail   = document.getElementById('rail');
    const track  = document.getElementById('railTrack');
    const kmText = document.getElementById('railKm');
    const chapters = document.querySelectorAll('.chapter, .finale');
    let ticks = [];

    // How far down the page we are, from 0 (top) to 1 (bottom).
    function getScrollProgress() {
      const max = root.scrollHeight - window.innerHeight;
      return max > 0 ? Math.min(Math.max(window.scrollY / max, 0), 1) : 1;
    }

    // Place a small checkpoint on the line for each chapter, at the
    // scroll progress where that chapter sits in the middle of the screen.
    function buildTicks() {
      ticks.forEach(t => t.el.remove());
      ticks = [];
      const max = root.scrollHeight - window.innerHeight;
      if (max <= 0) return;

      chapters.forEach(ch => {
        const rect = ch.getBoundingClientRect();
        const centre = rect.top + window.scrollY + rect.height / 2 - window.innerHeight / 2;
        const pos = Math.min(Math.max(centre / max, 0), 1);
        const el = document.createElement('span');
        el.className = 'rail__tick';
        el.style.top = (pos * 100) + '%';
        track.appendChild(el);
        ticks.push({ el, pos });
      });
    }

    // Push the latest progress into CSS + update km and checkpoints.
    function updateLine() {
      const p = getScrollProgress();
      rail.style.setProperty('--progress', p.toFixed(4));
      kmText.textContent = Math.round(p * CONFIG.distanceKm) + ' km';
      ticks.forEach(t => t.el.classList.toggle('is-passed', p >= t.pos - 0.002));
      rail.classList.toggle('is-arrived', p >= CONFIG.arriveAt);
    }

    // requestAnimationFrame keeps scrolling smooth (max one update per frame).
    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        updateLine();
        ticking = false;
      });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', () => { buildTicks(); updateLine(); });
    window.addEventListener('load',   () => { buildTicks(); updateLine(); });

    // Fonts can change the page height once loaded, so re-measure.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { buildTicks(); updateLine(); });
    }

    buildTicks();
    updateLine();
  }

    (function () {
      const lock  = document.getElementById('lock');
      const form  = document.getElementById('lockForm');
      const input = document.getElementById('lockInput');
      const btn   = document.getElementById('lockBtn');
      const msg   = document.getElementById('lockMsg');
      const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

      async function decrypt(password) {
        const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: fromB64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
          baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(PAYLOAD.iv) }, key, fromB64(PAYLOAD.ct));
        return new TextDecoder().decode(plain);
      }

      form.addEventListener('submit', async e => {
        e.preventDefault();
        btn.disabled = true;
        msg.textContent = '';
        lock.classList.remove('is-wrong');
        try {
          const html = await decrypt(input.value.trim().toLowerCase());
          document.getElementById('letter').innerHTML = html;
          window.scrollTo(0, 0);
          startLetter();
          lock.classList.add('is-open');
          input.blur();
        } catch (err) {
          void lock.offsetWidth; // restart the shake animation
          lock.classList.add('is-wrong');
          msg.textContent = 'Not quite. Try again.';
          input.select();
        } finally {
          btn.disabled = false;
        }
      });

      input.focus();
    })();
  </script>
